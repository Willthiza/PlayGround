<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d12">
<link rel="icon" href="data:,">
<title>UMBRA — Ceniza y juramento</title>
<style>
:root{color-scheme:dark;font-family:Georgia,"Times New Roman",serif;background:#080c11;color:#e8e4d8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c11}body{display:grid;place-items:center}#frame{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);max-height:100dvh;background:#0a1016;overflow:hidden;box-shadow:0 0 80px #000}canvas{display:block;width:100%;height:100%;image-rendering:auto;touch-action:none}.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px 25px #05080bc9}#mobile{display:none;position:absolute;inset:auto 0 max(14px,env(safe-area-inset-bottom)) 0;justify-content:space-between;align-items:end;padding:0 22px;pointer-events:none}#mobile .cluster{display:flex;gap:10px;align-items:end}#mobile button{pointer-events:auto;color:#f4eedb;background:#121a20c9;border:1px solid #d5c89955;border-radius:50%;width:57px;height:57px;font:700 19px Georgia;touch-action:none;box-shadow:0 3px 14px #0009;backdrop-filter:blur(4px)}#mobile button.big{width:67px;height:67px;color:#e7c77b}#mobile button:active{background:#a8874f99;transform:scale(.94)}@media(pointer:coarse){#mobile{display:flex}}@media(max-width:700px){#mobile{padding-inline:8px;gap:4px}#mobile .cluster{gap:4px}#mobile button{width:42px;height:42px;font-size:15px}#mobile button.big{width:48px;height:48px}}
</style>
</head>
<body>
<div id="frame"><canvas id="game" width="960" height="540" aria-label="Juego de plataformas Umbra"></canvas><div class="vignette"></div><div id="mobile"><div class="cluster"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="cluster"><button data-key="interact">E</button><button data-key="heal">H</button><button data-key="jump">↑</button><button data-key="dodge">↗</button><button data-key="attack" class="big">⚔</button></div></div></div>
<script src="game.js"></script>
</body>
</html>
